- text: "Соприкосновение со святыми людьми делает человека на период контакта тоже святым. Настоящая святость передается через личное присутствие и общение."
- text: "Наши предки были истинными Повелителями Вселенных. После глобальной катастрофы наша цивилизация стала стремительно сходить на нет."
- text: "С помощью сакрального звука «я» элохимы могли создавать целые миры. Слово и частота вибрации остаются главными инструментами творения реальности."
- text: "Возрождение древних традиций — единственный путь к спасению цивилизации. Официальная наука скрывает от нас подлинные хроники человечества."
- text: "Внутреннее состояние человека мгновенно перестраивается под влиянием высоких вибраций и гармоничной волшебной культуры."
