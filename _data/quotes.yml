quotes:
  - id: 1
    overview: "О духовном резонансе и биологической индукции"
    quote: "Соприкосновение со святыми людьми делает человека на период контакта тоже святым. Соприкосновение с волшебниками — волшебником, а с божественными силами Природы приближает человека к богу. В этом заключается суть явления биологической индукции, которое наши предки широко использовали в своей практике."

  - id: 2
    overview: "О значении народной философии и национальных ориентиров"
    quote: "Человек не может жить без веры, без чётких социальных ориентиров. Этические принципы, вытекающие из народной философии и национальной морали, помогут восстановить веру российского человека, с которой тысячелетиями жила Россия."

  - id: 3
    overview: "О связи эволюции общества и этики управления"
    quote: "Государством должны управлять духовные и высоконравственные люди. Без претворения в жизнь этических норм невозможна эволюция человека и общества."

  - id: 4
    overview: "О силе созидательного мышления"
    quote: "Подобное притягивает подобное: созидание притягивает созидание, а хаос притягивается к хаосу. Поэтому думать надо всегда правильно, положительно."

  - id: 5
    overview: "О предотвращении катаклизмов через высаживание садов"
    quote: "Чтобы спастись, нужно не готовиться к катаклизму, а всеми силами стараться упредить его. Для этого нужно высаживать сады и леса по высоким степеням симметрии, за тем, чтобы на Земле снова возобладали созидательные процессы."

  - id: 6
    overview: "О влиянии организованного пространства на судьбу планеты"
    quote: "Если лесные деревья сажать по принципам высоких симметрий (типа Священных Рощ), то организованное пространство будет запускать созидательные процессы на Земле, что отразится на судьбах людей, на всей биосфере и качестве жизни всех обитателей нашей планеты."

  - id: 7
    overview: "О климатической безопасности и экологии"
    quote: "В условиях покрытия Земли лесами никогда никакой климатической и экологической катастрофы произойти не может. Земля будет притягивать только созидательные процессы и высокоорганизованные структуры."