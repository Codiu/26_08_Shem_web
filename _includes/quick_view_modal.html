<!-- Quick View Modal Structure -->
<div class="modal-overlay" id="quickViewModal" aria-hidden="true">
  <div class="modal-backdrop"></div>
  <div class="modal-container" role="dialog" aria-labelledby="modalTitle">
    <button class="modal-close" id="modalClose" aria-label="Закрыть модальное окно">&times;</button>
    <div class="modal-body">
      <div class="modal-cover-column">
        <div class="modal-cover-frame">
          <img id="modalCover" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" alt="" class="modal-cover-img">
        </div>
      </div>
      <div class="modal-info-column">
        <div class="modal-meta-header">
          <span class="modal-author" id="modalAuthor">Владимир Алексеевич Шемшук</span>
          <span class="modal-sku" id="modalSku"></span>
        </div>
        <h2 class="modal-title" id="modalTitle">Заголовок Книги</h2>
        
        <div class="modal-desc" id="modalDesc">Описание книги...</div>

        <div class="modal-footer-action">
          <div class="modal-price-row">
            <span class="modal-price" id="modalPrice">0 ₽</span>
          </div>
          <div class="modal-actions">
            <button class="modal-btn-add" id="modalAddToCartBtn">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path><line x1="3" y1="6" x2="21" y2="6"></line><path d="M16 10a4 4 0 0 1-8 0"></path></svg>
              <span>Добавить в корзину</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
